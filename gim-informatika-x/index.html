<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyalakan Sirkuit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gim edukasi Informatika kelas X SMK (Fase E): tujuh misi berpikir komputasional, literasi digital, analisis data, serta algoritma dan pemrograman, ditutup Ujian Akhir.">
<meta name="theme-color" content="#06261b">
<style>
:root{
  /* Tata letak: papan sirkuit. Peta = papan induk (7 chip mengelilingi prosesor); layar lain = panel modul di atas papan. */
  --mask:#0b3a2a;
  --mask-deep:#06261b;
  --panel:#0f4632;
  --panel-hi:#155840;
  --line:#2b6b52;
  --ic:#16211c;
  --ic-hi:#22312a;
  --pin:#c3cdc7;
  --copper:#b8853a;
  --copper-lit:#f4c45f;
  --copper-hi:#ffd67e;
  --silk:#eef5ec;
  --silk-dim:#a9c8b8;
  --ink:#1c1406;
  --ok:#8af0b8;
  --ok-bg:rgba(138,240,184,.13);
  --bad:#ff9b84;
  --bad-bg:rgba(255,155,132,.13);
  --sel:#94d6ff;
  --sel-bg:rgba(148,214,255,.14);
  --led-off:#3a4a43;
  --shade:rgba(2,14,9,.55);
  --py-k:#f4c45f; --py-s:#b6e2ff; --py-n:#ffb8a0; --py-f:#d9c6ff; --py-c:#86a596;
  --sheet-bg:#f7f9f5; --sheet-head:#dfe7e0; --sheet-line:#b7c5ba;
  --f-display:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px;
  color-scheme:dark;
  background:var(--mask);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--mask);color:var(--silk);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(238,245,236,.05) 1px,transparent 1.6px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--mask-deep)}
[hidden]{display:none!important}
img,svg{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--copper-lit)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.6vw,40px);font-weight:700;letter-spacing:.01em}
h2{font-size:22px;font-weight:700}
h3,.h3{font-size:18px;font-weight:600;font-family:var(--f-display)}
p{margin:0}
ul,ol{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.92em}
code,.mono,.code,.code-tx,.report,.sheet,.fx,textarea{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{background:var(--mask-deep);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:pre-wrap;word-break:break-word}
.big{font-size:22px}
.small{font-size:14px}
.muted{color:var(--silk-dim)}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-lit)}
.lead{font-size:18px;color:var(--silk-dim);max-width:60ch}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.between{justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--panel-hi);color:var(--silk);font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.02em;cursor:pointer;text-decoration:none;
  transition:background .15s,border-color .15s,transform .08s;text-align:center}
.btn:hover{border-color:var(--silk-dim)}
.btn:active{transform:translateY(1px)}
.btn-gold{background:var(--copper-lit);border-color:var(--copper-lit);color:var(--ink)}
.btn-gold:hover{background:var(--copper-hi);border-color:var(--copper-hi)}
.btn-ghost{background:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn-lg{min-height:56px;padding:12px 30px;font-size:20px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);cursor:pointer;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:13px;font-weight:700;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .ic{width:16px;height:16px;color:var(--copper-lit)}

/* ---------- Bilah atas ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--mask-deep);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;min-width:0}
.brand .logo{width:30px;height:30px;flex:none}
.lg-a{fill:var(--ic);stroke:var(--copper-lit);stroke-width:2}.lg-b{fill:var(--copper-lit)}.lg-c{fill:none;stroke:var(--pin);stroke-width:2;stroke-linecap:round}
.b-short{display:none}
.hud{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav{max-width:1120px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:14px}
.nav button .ic{width:17px;height:17px}
.nav button[aria-current="page"]{background:var(--copper-lit);border-color:var(--copper-lit);color:var(--ink)}
.demo-bar{background:var(--copper-lit);color:var(--ink);font-weight:700;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo-bar .btn{background:var(--ink);color:var(--copper-lit);border-color:var(--ink)}
main{display:block;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
main:focus{outline:none}
.wrap{max-width:1120px;margin:0 auto}
.narrow{max-width:560px;margin:0 auto}
.crumb{margin-bottom:14px}

/* ---------- Bit (maskot) ---------- */
.bit{flex:none;display:block}
.bit .bh{fill:var(--silk)} .bit .bf{fill:var(--mask-deep)} .bit .be{fill:var(--ok)} .bit .bel{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round}
.bit .bl{fill:var(--copper-lit)} .bit .bb{fill:var(--copper)} .bit .ba{stroke:var(--silk);stroke-width:3;stroke-linecap:round}
.say{display:flex;gap:12px;align-items:flex-start}
.bubble{position:relative;background:var(--silk);color:var(--ink);padding:12px 15px;border-radius:12px;font-size:16px;line-height:1.45;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--silk);border-left:0}
.bubble code{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.18)}

/* ---------- Splash ---------- */
.splash{min-height:calc(100vh - 80px);display:grid;place-items:center;text-align:center;padding-block:24px}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:660px}
.splash-art{width:min(420px,88vw);height:auto}
.splash-title{font-size:clamp(46px,12vw,100px);line-height:.92;text-transform:uppercase;letter-spacing:.015em}
.splash-title .lit{display:block;color:var(--copper-lit);text-shadow:0 0 22px rgba(244,196,95,.5)}
.credit{font-size:14px;color:var(--silk-dim);border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.sp-base{fill:none;stroke:var(--copper);stroke-width:4;stroke-linejoin:round;opacity:.45}
.sp-lit{fill:none;stroke:var(--copper-lit);stroke-width:4;stroke-linejoin:round;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1s ease-out forwards}
.sp-chip{fill:var(--ic);stroke:var(--line);stroke-width:1.5}
.sp-pin{fill:var(--pin)}
.sp-led{fill:var(--led-off);animation:ledon .25s forwards}
.sp-txt{fill:var(--silk-dim);font-family:var(--f-mono);font-size:10px;font-weight:700}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ledon{to{fill:var(--ok)}}

/* ---------- Layar boot (sebelum layar judul) ---------- */
.boot{position:fixed;inset:0;z-index:60;background:var(--mask-deep);display:grid;place-items:center;cursor:pointer;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.boot::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,var(--shade) 0 1px,transparent 1px 4px);opacity:.35}
.boot-in{width:min(720px,100%);display:flex;flex-direction:column;gap:14px;font-family:var(--f-mono);font-variant-ligatures:none;animation:crt .5s ease-out both;transform-origin:center}
@keyframes crt{0%{transform:scale(.6,.004);filter:brightness(3)}55%{transform:scale(1,.004);filter:brightness(2)}100%{transform:none;filter:none}}
.boot-head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px}
.boot-head .logo{width:40px;height:40px;flex:none}
.boot-brand{font-weight:700;color:var(--copper-lit);letter-spacing:.08em;font-size:15px}
.boot-sub{color:var(--silk-dim);font-size:13px;font-family:var(--f-body)}
#boot-bit{margin-left:auto}
.boot-log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.boot-log li{display:flex;align-items:baseline;gap:8px;animation:blIn .16s ease-out both}
.bl-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--silk)}
.bl-d{flex:1;min-width:14px;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.bl-s{white-space:nowrap;font-weight:700;animation:blIn .14s .1s ease-out both}
.bl-s.ok{color:var(--ok)} .bl-s.siap{color:var(--copper-lit)} .bl-s.padam{color:var(--silk-dim)}
@keyframes blIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.boot-bar{height:10px;border:1px solid var(--line);border-radius:99px;background:var(--mask);overflow:hidden}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--copper-lit));transition:width .2s ease}
.boot.ready .boot-bar i{box-shadow:0 0 14px var(--copper-lit)}
.boot-meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--silk-dim)}
.boot-meta b{color:var(--copper-lit);font-variant-numeric:tabular-nums}
.boot.ready .boot-meta span{color:var(--ok);font-weight:700}
.boot-skip{font-size:13px;color:var(--silk-dim);text-align:center;font-family:var(--f-body);animation:kedip 1.6s ease-in-out infinite}
@keyframes kedip{50%{opacity:.35}}
.boot-credit{font-family:var(--f-body);font-size:13px;color:var(--silk-dim);text-align:center;border-top:1px solid var(--line);padding-top:10px}
.boot.out{animation:bootOut .3s ease-in forwards}
@keyframes bootOut{to{opacity:0;filter:brightness(2.2)}}
@media (max-width:420px){.boot-log{font-size:12.5px}.boot-brand{font-size:14px}}

/* ---------- Papan sirkuit (peta) ---------- */
.hub{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.hub-head{margin-bottom:14px;display:flex;flex-direction:column;gap:4px}
.board{container-type:inline-size;position:relative;width:100%;max-width:max(340px,min(660px,calc((100vh - 230px) * .952)));aspect-ratio:100/105;margin-inline:auto;border-radius:18px;
  background:radial-gradient(ellipse at 50% 50%,var(--panel) 0%,var(--mask) 72%);border:1px solid var(--line);
  box-shadow:inset 0 0 0 7px var(--mask-deep),inset 0 0 0 8px var(--line)}
.traces{position:absolute;inset:0;width:100%;height:100%}
.trace{fill:none;stroke:var(--copper);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.33;vector-effect:non-scaling-stroke}
.trace.lit{opacity:1;stroke:var(--copper-lit)}
.flow{fill:none;stroke:var(--silk);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 13;vector-effect:non-scaling-stroke;animation:flow 1s linear infinite;opacity:.9}
@keyframes flow{to{stroke-dashoffset:-16}}
.deco{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.via{fill:var(--mask-deep);stroke:var(--copper);stroke-width:2;vector-effect:non-scaling-stroke}
.hole{fill:var(--mask-deep);stroke:var(--copper);stroke-width:3;vector-effect:non-scaling-stroke}
.silk{fill:var(--silk-dim);font-family:var(--f-mono);font-size:1.9px;font-weight:700;letter-spacing:.12px;opacity:.75}
.chip{position:absolute;transform:translate(-50%,-50%);width:24%;height:14.6%;padding:4px 7px 4px 9px;display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:left;
  background:linear-gradient(180deg,var(--ic-hi),var(--ic));border:1px solid var(--mask-deep);border-radius:5px;cursor:pointer;color:var(--silk);
  box-shadow:0 3px 0 var(--mask-deep),0 8px 16px var(--shade);transition:transform .15s}
.chip:hover{transform:translate(-50%,-52%)}
.chip::before,.chip::after{content:"";position:absolute;left:12%;right:12%;height:5px;background:repeating-linear-gradient(90deg,var(--pin) 0 3px,transparent 3px 8px)}
.chip::before{top:-6px}.chip::after{bottom:-6px}
.c-code{font-family:var(--f-mono);font-weight:700;font-size:clamp(9px,1.75cqw,12px);color:var(--silk-dim);letter-spacing:.05em;line-height:1.2}
.c-name{font-family:var(--f-display);font-weight:700;font-size:clamp(11px,2.65cqw,17px);line-height:1.08}
.c-stat{display:flex;align-items:center;gap:2px;color:var(--copper-lit);font-size:clamp(9px,1.7cqw,12px);font-family:var(--f-mono);line-height:1.2}
.c-stat .ic{width:clamp(10px,2.2cqw,15px);height:clamp(10px,2.2cqw,15px)}
.c-stat .off{color:var(--led-off)}
.c-led{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--led-off)}
.c-k{display:none;color:var(--silk-dim);font-weight:700;margin-right:3px}
@container (max-width:470px){.chip .c-code{display:none}.c-k{display:inline}.chip{padding:3px 5px 3px 7px}.chip.cpu .c-code{display:none}}
.chip.done .c-led{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chip.part .c-led{background:var(--copper-lit);box-shadow:0 0 8px var(--copper-lit)}
.chip.next{outline:2px solid var(--copper-lit);outline-offset:4px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.chip.locked{cursor:not-allowed;opacity:.55}
.chip.locked .c-stat{color:var(--silk-dim)}
.chip.cpu{width:34%;height:23%;align-items:center;text-align:center;padding:8px;
  background:linear-gradient(135deg,var(--ic-hi),var(--ic));border-radius:8px}
.chip.cpu::before,.chip.cpu::after{left:8%;right:8%}
.chip.cpu .die{position:absolute;inset:16%;border:1px solid var(--line);border-radius:4px;pointer-events:none}
.chip.cpu .c-name{font-size:clamp(18px,5cqw,30px);letter-spacing:.06em}
.chip.cpu.on{box-shadow:0 0 0 2px var(--copper-lit),0 0 34px rgba(244,196,95,.45)}
.chip.cpu.on .c-name{color:var(--copper-lit)}
.pwr{position:absolute;transform:translate(-50%,-50%);width:10%;height:13%;border-radius:4px;background:var(--ic);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--f-mono);font-weight:700;font-size:clamp(8px,1.6cqw,11px);color:var(--silk-dim)}
.pwr i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.side{display:flex;flex-direction:column;gap:16px}
.player .who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:14px 12px}
.stat3 div{background:var(--mask);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.stat3 b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12px;color:var(--silk-dim);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.xpbar{height:8px;background:var(--mask-deep);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--copper),var(--copper-lit))}
.steps{list-style:none;padding:0;display:grid;gap:10px;counter-reset:s;margin-top:10px}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--copper-lit);color:var(--copper-lit)}

/* ---------- Briefing ---------- */
.brief-head{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.brief-head .say{max-width:720px;margin-top:6px}
.brief-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mcard h3{font-size:17px;color:var(--copper-lit)}
.mcard p{font-size:15.5px}
.kerja{border-left:3px solid var(--copper-lit);padding:10px 14px;background:var(--mask-deep);border-radius:0 10px 10px 0}
.mission{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px)}
.spec{list-style:none;padding:0;display:grid;gap:8px}
.spec li{display:flex;justify-content:space-between;gap:14px;border-bottom:1px dashed var(--line);padding-bottom:7px;font-size:15px}
.spec li b{font-family:var(--f-mono);text-align:right}

/* ---------- Area main ---------- */
.play{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.play-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.play-top .eyebrow{flex:1;min-width:140px}
.pips{display:flex;gap:5px}
.pips i{flex:1;height:7px;border-radius:4px;background:var(--mask-deep);border:1px solid var(--line)}
.pips i.done{background:var(--copper-lit);border-color:var(--copper-lit)}
.pips i.now{background:var(--silk-dim)}
.task{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.task-kind{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--silk-dim)}
.task-q{font-family:var(--f-body);font-size:19px;font-weight:700;line-height:1.4;text-wrap:pretty}
.task-q:focus{outline:none}
.task-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.hintbox .bubble{font-size:15px}
.fb{border-radius:14px;padding:16px 18px;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:12px}
.fb.ok{border-color:var(--ok)} .fb.bad{border-color:var(--bad)} .fb.part{border-color:var(--copper-lit)}
.fb-head{display:flex;align-items:center;gap:12px}
.fb-title{font-family:var(--f-display);font-size:21px;font-weight:700}
.fb.ok .fb-title{color:var(--ok)} .fb.bad .fb-title{color:var(--bad)} .fb.part .fb-title{color:var(--copper-lit)}
.fb-body{display:flex;flex-direction:column;gap:8px}
.fb .btn{align-self:flex-start}

/* Pilihan ganda */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr) 22px;gap:12px;align-items:center;text-align:left;padding:11px 14px;min-height:54px;border:1px solid var(--line);background:var(--mask);border-radius:10px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--silk-dim)}
.opt .k{font-family:var(--f-mono);font-weight:700;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg)}
.opt[aria-pressed="true"] .k{background:var(--sel);color:var(--ink);border-color:var(--sel)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .k{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .k{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.opt code{white-space:pre-wrap}

/* Kode */
.code{font-family:var(--f-mono);font-size:14.5px;line-height:1.6;background:var(--mask-deep);border:1px solid var(--line);border-radius:10px;padding:10px 0;overflow-x:auto}
.code .ln{display:grid;grid-template-columns:40px max-content;white-space:pre;padding:1px 16px 1px 0;width:100%;min-width:max-content;text-align:left;background:none;border:0;border-left:3px solid transparent;cursor:default}
.code .ln::before{content:attr(data-n);color:var(--py-c);text-align:right;padding-right:14px}
.code.pick .ln{cursor:pointer}
.code.pick .ln:hover{background:var(--sel-bg)}
.code .ln[aria-pressed="true"]{background:var(--sel-bg);border-left-color:var(--sel)}
.code .ln.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.code .ln.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.py-k{color:var(--py-k);font-weight:700} .py-s{color:var(--py-s)} .py-n{color:var(--py-n)} .py-f{color:var(--py-f)} .py-c{color:var(--py-c);font-style:italic}
.bug-info{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--copper-lit);padding:8px 14px;background:var(--mask-deep);border-radius:0 10px 10px 0}

/* Kelompokkan / pasangkan */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:60px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--mask);align-items:flex-start}
.tok{display:block;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel-hi);cursor:grab;text-align:left;touch-action:none;max-width:100%;font-size:15.5px;line-height:1.35;user-select:none;-webkit-user-select:none}
.tok:hover{border-color:var(--silk-dim)}
.tok[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel);background:var(--sel-bg)}
.tok.ok{border-color:var(--ok);background:var(--ok-bg)}
.tok.bad{border-color:var(--bad);background:var(--bad-bg)}
.tok .fix{display:block;font-size:13px;color:var(--bad);font-family:var(--f-mono);font-weight:700;margin-top:3px}
.tok.dragging{opacity:.35}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:.95;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 10px 24px var(--shade);max-width:280px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.bin{border:1px solid var(--line);border-radius:12px;background:var(--mask);min-height:120px;display:flex;flex-direction:column;cursor:pointer}
.bin-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:16px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);text-align:left;background:var(--ic);border-radius:12px 12px 0 0;cursor:pointer;color:var(--copper-lit)}
.bin-head .cnt{font-family:var(--f-mono);font-size:12px;color:var(--silk-dim)}
.bin-body{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.bin.hot{border-color:var(--sel);background:var(--sel-bg)}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:minmax(96px,28%) minmax(0,1fr);gap:10px;align-items:stretch}
.pair .term{font-family:var(--f-display);font-weight:700;display:flex;align-items:center;padding:10px 12px;background:var(--ic);border:1px solid var(--line);border-radius:9px;color:var(--copper-lit);line-height:1.2}
.slot{min-height:50px;border:1px dashed var(--line);border-radius:9px;padding:6px;display:flex;align-items:center;cursor:pointer;background:var(--mask);text-align:left;width:100%}
.slot.hot{border-color:var(--sel);background:var(--sel-bg)}
.slot .ph{color:var(--silk-dim);font-size:14px;padding-left:6px}
.slot .tok{cursor:pointer;width:100%}

/* Urutkan */
.urut{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.ulist{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.uitem{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-hi);cursor:pointer;line-height:1.4}
.uitem:hover{border-color:var(--silk-dim)}
.uitem .no{font-family:var(--f-mono);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--mask-deep);color:var(--copper-lit)}
.uitem .no .ic{width:14px;height:14px}
.uitem.ok{border-color:var(--ok);background:var(--ok-bg)} .uitem.bad{border-color:var(--bad);background:var(--bad-bg)}
.uitem[disabled]{cursor:default}
.uslot{border:1px dashed var(--line);border-radius:9px;min-height:48px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:8px 12px;color:var(--silk-dim)}
.uslot .no{font-family:var(--f-mono);font-weight:700;font-size:13px;text-align:center}
.code-tx{font-family:var(--f-mono);font-size:14px;white-space:pre;overflow-x:auto;display:block}

/* Tabel data */
.dt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.dt{border-collapse:collapse;width:100%;min-width:560px;font-size:15px;font-variant-numeric:tabular-nums}
.dt caption{text-align:left;padding:10px 12px;font-family:var(--f-display);font-weight:700;background:var(--ic);color:var(--copper-lit)}
.dt th,.dt td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.dt th{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--silk-dim);background:var(--mask-deep)}
.dt td.num{font-family:var(--f-mono);color:var(--silk-dim)}
.dt tr.flag td{background:var(--sel-bg)}
.dt tr.ok td{background:var(--ok-bg)} .dt tr.miss td,.dt tr.bad td{background:var(--bad-bg)}
.dt td.kosong{background-image:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px)}
.tg{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--mask);display:grid;place-items:center;cursor:pointer;color:var(--silk);font-family:var(--f-mono);font-weight:700;font-size:14px}
.tg:hover{border-color:var(--sel)}
.tg[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--ink)}
.reasons{list-style:none;padding:0;display:grid;gap:6px}
.reasons li{display:flex;gap:8px;align-items:flex-start}
.reasons li.ok .ic{color:var(--ok)} .reasons li.miss .ic,.reasons li.bad .ic{color:var(--bad)}

/* Spreadsheet & grafik */
.sheet-wrap{display:inline-flex;flex-direction:column;max-width:100%;border:1px solid var(--sheet-line);border-radius:8px;overflow:hidden;background:var(--sheet-bg);color:var(--ink);align-self:flex-start}
.fx{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--sheet-line);font-family:var(--f-mono);font-size:14px;background:var(--sheet-bg)}
.fx span{font-style:italic;font-weight:700;color:var(--copper)}
.fx code{background:transparent;border:0;padding:0;color:var(--ink)}
.sheet{border-collapse:collapse;font-family:var(--f-mono);font-size:14.5px;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border:1px solid var(--sheet-line);padding:5px 14px;min-width:44px}
.sheet th{background:var(--sheet-head);font-weight:700;font-size:12.5px;text-align:center}
.sheet td.hd{font-weight:700}
.sheet td.num{text-align:right}
.chart{margin:0;max-width:520px;background:var(--mask-deep);border:1px solid var(--line);border-radius:12px;padding:12px}
.chart figcaption{font-family:var(--f-display);font-weight:700;margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-ax{fill:var(--silk-dim);font-family:var(--f-mono);font-size:11px}
.ch-cat{fill:var(--silk);font-family:var(--f-mono);font-size:11.5px}
.ch-val{fill:var(--silk);font-family:var(--f-mono);font-size:12px;font-weight:700}
.ch-bar{fill:var(--copper-lit)}
.abc{display:flex;flex-wrap:wrap;gap:3px}
.abc span{width:26px;height:28px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--mask-deep);border:1px solid var(--line);border-radius:5px}

/* Kartu kilat */
.qmeta{display:flex;justify-content:space-between;gap:10px}
.timer{height:8px;background:var(--mask-deep);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--copper-lit);transform-origin:left center}
.qcard{border:1px solid var(--line);background:var(--mask);border-radius:14px;padding:24px 20px;min-height:130px;display:grid;place-items:center;text-align:center;font-size:19px;font-weight:700;line-height:1.45;overflow-wrap:anywhere}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{min-height:62px;font-size:18px}
.q-a{border-color:var(--ok)} .q-b{border-color:var(--bad)}
.qbtn[disabled]{opacity:.5}
.qbtn.ok,.qbtn.bad{opacity:1}
.qbtn.ok{background:var(--ok);color:var(--ink);border-color:var(--ok)}
.qbtn.bad{background:var(--bad);color:var(--ink);border-color:var(--bad)}
.qfb{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.qsum{list-style:none;padding:0;display:grid;gap:8px}
.qsum li{display:flex;gap:8px;align-items:flex-start}
.qsum li.ok>.ic{color:var(--ok)} .qsum li.bad>.ic{color:var(--bad)}
.qsum .big{font-size:16px}

/* Robot kurir */
.robot-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.rgrid{position:relative;display:grid;grid-template-columns:repeat(var(--w),1fr);aspect-ratio:var(--w)/var(--h);width:100%;max-width:440px;margin-inline:auto;
  background:var(--mask-deep);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.rcell{position:relative;box-shadow:inset 0 0 0 .5px var(--line)}
.rcell svg{position:absolute;left:10%;top:10%;width:80%;height:80%}
.g-b{fill:var(--ic-hi);stroke:var(--line);stroke-width:1.5}
.g-w{fill:var(--silk-dim);opacity:.45}
.sv-b{fill:var(--copper-lit)} .sv-l{fill:var(--ink)} .sv-led{fill:var(--ok)}
.rcell.goal{background:rgba(244,196,95,.12)}
.rcell.start::after{content:"";position:absolute;inset:30%;border:2px dashed var(--silk-dim);border-radius:50%;opacity:.5}
.rbot{position:absolute;left:0;top:0;width:calc(100% / var(--w));height:calc(100% / var(--h));transition:transform .34s ease;display:grid;place-items:center;pointer-events:none;z-index:2}
.rb-in{width:84%;height:84%;transition:transform .3s ease}
.rb-in svg{width:100%;height:100%;display:block}
.bt-n{fill:var(--copper-lit)}.bt-b{fill:var(--silk)}.bt-f{fill:var(--mask-deep)}.bt-e{fill:var(--ok)}
.rbot.bump .rb-in{animation:bump .35s}
.rbot.win .rb-in svg{filter:drop-shadow(0 0 8px var(--copper-lit))}
@keyframes bump{30%{transform:var(--rot) scale(.82)}60%{transform:var(--rot) scale(1.08)}}
.rctrl{display:flex;flex-direction:column;gap:12px;min-width:0}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;min-height:68px;border-radius:10px;border:1px solid var(--copper-lit);background:var(--ic);cursor:pointer;font-weight:700;font-size:14px}
.cmd .ic{width:26px;height:26px;color:var(--copper-lit)}
.cmd:hover{background:var(--ic-hi)}
.cmd[disabled],.blk[disabled]{opacity:.5;cursor:default}
.prog-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prog{list-style:none;padding:10px;margin:0;display:flex;flex-wrap:wrap;gap:6px;min-height:62px;border:1px dashed var(--line);border-radius:10px;background:var(--mask)}
.blk{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:48px;border-radius:8px;border:1px solid var(--line);background:var(--panel-hi);cursor:pointer;font-family:var(--f-mono);font-size:11px;font-weight:700;gap:1px}
.blk .ic{width:18px;height:18px;color:var(--copper-lit)}
.blk.run{background:var(--copper-lit);color:var(--ink);border-color:var(--copper-lit)}
.blk.run .ic{color:var(--ink)}
.prog .empty{align-self:center;padding:4px}
.rmsg{min-height:1.5em;font-weight:700;color:var(--copper-lit)}

/* Hasil */
.result{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.score-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.score-big{font-family:var(--f-display);font-size:clamp(72px,15vw,120px);font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;color:var(--copper-lit)}
.score-big small{font-size:.28em;color:var(--silk-dim);margin-left:4px}
.stars-big{display:flex;gap:8px;margin-bottom:10px}
.stars-big .ic{width:42px;height:42px;color:var(--led-off)}
.stars-big .on{color:var(--copper-lit)}
.status{font-family:var(--f-display);font-size:22px;font-weight:700}
.status.ok{color:var(--ok)} .status.part{color:var(--copper-lit)} .status.bad{color:var(--bad)}
.review{display:flex;flex-direction:column;gap:8px}
.review details{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.review summary{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.review summary::-webkit-details-marker{display:none}
.rv-n{font-family:var(--f-mono);font-weight:700;color:var(--silk-dim)}
.rv-t{font-weight:700;overflow-wrap:anywhere}
.rv-b{padding:0 16px 14px 52px;display:flex;flex-direction:column;gap:8px}
.chipstat{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid;white-space:nowrap;font-family:var(--f-mono)}
.chipstat.ok{color:var(--ok);border-color:var(--ok)} .chipstat.part{color:var(--copper-lit);border-color:var(--copper-lit)}
.chipstat.bad{color:var(--bad);border-color:var(--bad)} .chipstat.none{color:var(--silk-dim);border-color:var(--line)}
.kunci-ul,.kunci-ol{padding-left:22px;display:grid;gap:4px}

/* Lencana */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.badge svg{width:58px;height:58px}
.badge b{font-family:var(--f-display);font-size:15px;line-height:1.2}
.badge span{font-size:13px;color:var(--silk-dim);line-height:1.35}
.badge.off{opacity:.5}
.hex{fill:var(--ic);stroke:var(--line);stroke-width:3}
.badge.on .hex{fill:var(--copper);stroke:var(--copper-lit)}
.hex-t{fill:var(--silk);font-family:var(--f-mono);font-weight:700;font-size:15px}
.badge.on .hex-t{fill:var(--ink)}

/* Tabel umum */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--silk-dim);white-space:nowrap}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.report{font-family:var(--f-mono);font-size:13.5px;line-height:1.6;background:var(--mask-deep);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:360px;overflow:auto}
label{font-weight:700;font-size:15px}
input[type="text"],input[type="password"],textarea{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--mask-deep);color:var(--silk);font-size:16px}
textarea{min-height:150px;font-family:var(--f-mono);font-size:13.5px}
input:focus,textarea:focus{outline:2px solid var(--sel);outline-offset:1px;border-color:var(--sel)}
.field{display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.okmsg{color:var(--ok);font-weight:700}
.dim-list{padding-left:20px;display:grid;gap:6px}

/* Modal & toast */
.backdrop{position:fixed;inset:0;background:var(--shade);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:80;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal img{border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--silk);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:700;z-index:90;max-width:calc(100% - 32px);box-shadow:0 10px 26px var(--shade);text-align:center}

/* ---------- Responsif ---------- */
@media (max-width:900px){
  .hub,.brief-grid{grid-template-columns:minmax(0,1fr)}
  .mission{position:static}
}
@media (max-width:720px){
  .robot-wrap{grid-template-columns:minmax(0,1fr)}
  .score-hero{grid-template-columns:minmax(0,1fr);gap:12px}
}
@media (max-width:640px){
  .urut{grid-template-columns:minmax(0,1fr)}
  .task{padding:16px}
  .task-q{font-size:18px}
  .b-full{display:none}.b-short{display:inline}
  .brand{font-size:17px}
  .pair{grid-template-columns:minmax(0,1fr)}
  .rv-b{padding-left:16px}
  table.dt{min-width:0;font-size:13px}
  .dt th,.dt td{white-space:normal;padding:6px 5px}
  .dt th{font-size:10px;letter-spacing:.02em}
  .tg{width:34px;height:34px}
  .sm-hide{display:none}
}
@media (max-width:420px){
  #btn-fs{display:none}
  .pill{padding:5px 9px;font-size:12.5px}
  .qbtn{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .sp-lit{stroke-dashoffset:0}
  .sp-led{fill:var(--ok)}
}
@media print{
  body{background:#fff;background-image:none;color:#000}
  body::before,.topbar,.demo-bar,.no-print,.toast,.backdrop{display:none!important}
  main{padding:0}
  .panel,.report,.badge{background:#fff!important;color:#000!important;border-color:#999!important}
  .tbl th,.tbl td,.muted,.eyebrow,.badge span{color:#000!important;border-color:#999!important}
  .chipstat{color:#000!important;border-color:#000!important}
  .report{max-height:none}

    b = `Setiap huruf digeser ${n} ke kanan: ${[...kata].map(h => `${h}→${caesar(h, n)}`).join(", ")}. Hasilnya <code>${c}</code>. Hanya penerima yang tahu kuncinya (geser ${n}) yang mudah mengembalikan pesan ini.`; }
  else { q = `Pesan rahasia <code>${c}</code> dibuat dengan sandi Caesar geser <b>${n}</b> ke kanan. Apa pesan aslinya?`;
    o = isi(kata, [caesar(c, n), caesar(c, -(n + 1)), caesar(c, n === 1 ? -3 : -(n - 1))]);
    b = `Untuk mendekripsi, geser setiap huruf ${n} ke kiri: ${[...c].map(h => `${h}→${caesar(h, -n)}`).join(", ")}. Pesan aslinya <code>${kata}</code>.`; }
  return tPilih({q, judul:"Sandi Caesar", html:abc, o:o.map(x => `<code>${x}</code>`), b, h:"Hitung pergeseran huruf satu per satu memakai alfabet di atas. Setelah Z, kembali ke A."}, "Enkripsi");
}
function genIP() {
  const ok = () => rand(0, 255), hs = () => rand(1, 254);
  const valid = [() => `192.168.${ok()}.${hs()}`, () => `10.${ok()}.${ok()}.${hs()}`, () => `172.${rand(16, 31)}.${ok()}.${hs()}`, () => `192.0.2.${hs()}`, () => `198.51.100.${hs()}`, () => `203.0.113.${hs()}`];
  const salah = [
    () => { const b = rand(256, 320), p = [192, 168, ok(), hs()]; p[rand(2, 3)] = b; return [p.join("."), `Ada angka ${b}, padahal setiap bagian maksimal 255.`]; },
    () => [`192.168.${ok()}`, "Hanya ada 3 bagian; IPv4 harus terdiri dari 4 bagian."],
    () => [`10.${ok()}.${ok()}.${hs()}.${hs()}`, "Ada 5 bagian; IPv4 harus tepat 4 bagian."],
    () => [`192.168.1${pick(["a","b","x"])}.${hs()}`, "Mengandung huruf; IPv4 hanya berisi angka."],
    () => [`192,168,${ok()},${hs()}`, "Pemisahnya harus titik, bukan koma."]
  ];
  const item = [...acak(valid).slice(0, 3).map(f => [f(), "Valid", "Terdiri dari 4 bagian dan semuanya angka 0–255."]),
                ...acak(salah).slice(0, 3).map(f => { const [ip, w] = f(); return [ip, "Tidak valid", w]; })];
  return {t:"kilat", jenis:"Kartu kilat", judul:"Alamat IPv4 valid atau tidak?", q:"Tentukan apakah alamat IPv4 berikut <b>Valid</b> atau <b>Tidak valid</b>.", tombol:["Valid","Tidak valid"],
    item:acak(item).map(([x, k, w]) => ({x:`<span class="mono big">${esc(x)}</span>`, k, w})), b:"IPv4 terdiri dari 4 bagian angka 0–255 yang dipisahkan titik."};
}

function susunTugas(rencana) {
  const out = [];
  for (const [jenis, kunci, n] of rencana) {
    if (jenis === "pilih") acak(BANK.pilih[kunci]).slice(0, n).forEach(d => out.push(tPilih(d)));
    else if (jenis === "tebak") acak(BANK.tebak).slice(0, n).forEach(d => out.push(tPilih({q:"Apa keluaran (output) program berikut?", judul:"Tebak output: " + d.kode[d.kode.length - 1].trim(), kode:d.kode, o:d.o.map(x => `<code>${esc(x)}</code>`), b:d.b, h:d.h}, "Telusuri program")));
    else if (jenis === "bug") acak(BANK.bug).slice(0, n).forEach(d => out.push({t:"bug", jenis:"Cari bug", judul:"Cari bug: " + d.tujuan, q:"Program ini belum sesuai tujuan. Di baris mana bug-nya?", ...d}));
    else if (jenis === "kelompok") for (let i = 0; i < n; i++) out.push(tKelompok(BANK.kelompok[kunci]));
    else if (jenis === "pasang") for (let i = 0; i < n; i++) out.push(tPasang(BANK.pasang[kunci]));
    else if (jenis === "urut") { const pool = kunci === "*" ? Object.values(BANK.urut).flat() : BANK.urut[kunci]; acak(pool).slice(0, n).forEach(d => out.push({t:"urut", jenis:"Urutkan", ...d})); }
    else if (jenis === "tabel") acak(BANK.tabel).slice(0, n).forEach(d => out.push({t:"tabel", jenis:"Bersihkan data", q:`Tandai baris data yang bermasalah pada tabel <b>${d.judul}</b>.`, ...d, judul:"Bersihkan data: " + d.judul}));
    else if (jenis === "kilat") for (let i = 0; i < n; i++) out.push(tKilat(BANK.kilat[kunci]));
    else if (jenis === "robot") { [1, 2, 3].slice(0, n).forEach(tk => { const m = pick(BANK.robot.filter(r => r.tingkat === tk)); out.push({t:"robot", jenis:"Robot kurir", judul:`Robot kurir · peta ${["", "mudah", "sedang", "sulit"][tk]}`, q:"Susun program agar Bit mengantar paket ke server.", ...m, sol:solusiRobot(m)}); }); }
    else if (jenis === "sheet") acak(["SUM","AVERAGE","MAX","MIN","COUNTIF","IF"]).slice(0, n).forEach(f => out.push(genSheet(f)));
    else if (jenis === "grafik") acak(["max","min","selisih","total"]).slice(0, n).forEach(j => out.push(genGrafik(j)));
    else if (jenis === "sandi") for (let i = 0; i < n; i++) out.push(genSandi());
    else if (jenis === "ipkilat") for (let i = 0; i < n; i++) out.push(genIP());
  }
  return out;
}

TIPE.kelompok = (t, el, ctx) => {
  const n = t.item.length, pos = Array(n).fill(-1), satu = !!t.baris, ac = new AbortController();

    <div class="tray" data-zone="-1" aria-label="Kartu yang belum ditempatkan"></div><div class="${satu ? "pairs" : "bins"}"></div>`;
  const tray = $(".tray", el), wadahEl = $(satu ? ".pairs" : ".bins", el);
  const kelasTok = i => !tandai ? "" : (t.wadah[pos[i]] === t.item[i].k ? "ok" : "bad");
  const tok = (i, dalamSlot) => {
    const fix = tandai && kelasTok(i) === "bad" ? `<span class="fix">→ ${t.item[i].k}</span>` : "";
    return dalamSlot ? `<span class="tok ${kelasTok(i)}" data-tok="${i}">${t.item[i].x}${fix}</span>`
      : `<button class="tok ${kelasTok(i)}" data-tok="${i}" aria-pressed="${sel === i}" ${cek ? "disabled" : ""}>${t.item[i].x}${fix}</button>`;
  };
  function gambar(fokus) {
    const sisa = [...Array(n).keys()].filter(i => pos[i] === -1);
    tray.innerHTML = sisa.length ? sisa.map(i => tok(i)).join("") : `<span class="muted small">${cek ? "Hasil pemeriksaan ditandai pada kartu." : "Semua kartu sudah ditempatkan. Tekan Periksa."}</span>`;
    if (satu) wadahEl.innerHTML = t.wadah.map((w, z) => { const i = pos.indexOf(z);
      return `<div class="pair"><div class="term">${w}</div><button class="slot" data-zone="${z}" ${cek ? "disabled" : ""} aria-label="Kotak untuk ${esc(tanpaTag(w))}${i >= 0 ? ": " + esc(tanpaTag(t.item[i].x)) : ", kosong"}">${i >= 0 ? tok(i, true) : '<span class="ph">Ketuk untuk menempatkan</span>'}</button></div>`; }).join("");
    else wadahEl.innerHTML = t.wadah.map((w, z) => { const isi = [...Array(n).keys()].filter(i => pos[i] === z);
      return `<div class="bin" data-zone="${z}"><button class="bin-head" data-zone="${z}" ${cek ? "disabled" : ""}>${w}<span class="cnt">${isi.length}</span></button><div class="bin-body">${isi.map(i => tok(i)).join("")}</div></div>`; }).join("");
    ctx.siap(pos.every(x => x !== -1));
    if (typeof fokus === "function") fokus = fokus();
    if (fokus) { const f = el.querySelector(fokus); if (f) f.focus({preventScroll:true}); }
  }
  function taruh(i, z) { if (satu) { const lama = pos.indexOf(z); if (lama >= 0 && lama !== i) pos[lama] = -1; } pos[i] = z; bunyi("klik"); }
  el.addEventListener("click", e => {
    if (cek) return; if (tahan) { tahan = false; return; }
    const tk = e.target.closest("button.tok"), zone = e.target.closest("[data-zone]");
    if (tk) { const i = +tk.dataset.tok; if (pos[i] !== -1) { pos[i] = -1; sel = i; } else sel = sel === i ? -1 : i; bunyi("klik"); gambar(`button.tok[data-tok="${i}"]`); return; }
    if (!zone) return; const z = +zone.dataset.zone;
    if (sel >= 0 && z >= 0) { const i = sel; taruh(i, z); sel = -1; gambar(() => satu ? `.slot[data-zone="${z}"]` : (tray.querySelector("button.tok") ? ".tray button.tok" : `.bin-head[data-zone="${z}"]`)); return; }

  }, {signal:ac.signal});
  el.addEventListener("pointerdown", e => {

  const zonaDi = (x, y) => { const z = document.elementFromPoint(x, y); return z && el.contains(z) ? z.closest("[data-zone]") : null; };
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.ghost) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return; drag.ghost = drag.el.cloneNode(true); drag.ghost.classList.add("ghost"); document.body.appendChild(drag.ghost); drag.el.classList.add("dragging"); }
    e.preventDefault(); drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";

TIPE.kilat = (t, el, ctx) => {
  const n = t.item.length, D = KONFIG.detikKilat, hasil = []; let k = -1, raf = 0, t0 = 0, terjawab = true, mati = false;
  el.innerHTML = kepala(t) + `<div class="stack" id="kl"><p class="muted">${n} kartu · ${D} detik per kartu. Jawab secepat dan setepat mungkin. Di komputer, kamu juga bisa memakai tombol panah kiri dan kanan.</p><div><button class="btn btn-gold" data-q="go">${ic("play")} Mulai</button></div></div>`;
  const box = $("#kl", el);
  function kartu() {
    k++; terjawab = false; const it = t.item[k];
    box.innerHTML = `<div class="qmeta"><span class="pill">Kartu ${k + 1}/${n}</span><span class="pill" id="qsec">${D} detik</span></div><div class="timer" aria-hidden="true"><i id="qbar"></i></div>

    const bar = $("#qbar", box), sec = $("#qsec", box); if (bar) bar.style.transform = `scaleX(${sisa / D})`; if (sec) sec.textContent = `${Math.ceil(sisa)} detik`;

TIPE.robot = (t, el, ctx) => {
  const g = t.peta, H = g.length, W = g[0].length, A = ["N","E","S","W"], SUDUT = {N:-90, E:0, S:90, W:180}, D = {N:[0,-1], E:[1,0], S:[0,1], W:[-1,0]};
  const NAMA = {M:"Maju", L:"Belok Kiri", R:"Belok Kanan"}, IKON = {M:"up", L:"left", R:"right"}, ARAH = {N:"atas", E:"kanan", S:"bawah", W:"kiri"};
  let sx, sy, gx, gy; g.forEach((r, y) => [...r].forEach((c, x) => { if (c === "S") { sx = x; sy = y; } if (c === "G") { gx = x; gy = y; } }));
  const sol = t.sol, maks = sol.length + 4; let prog = [], jalan = false, gagal = 0, rot = SUDUT[t.arah], selesai = false, menyerah = false, mati = false;
  el.innerHTML = kepala(t) + `<p class="muted">Peta ${["", "mudah", "sedang", "sulit"][t.tingkat]} · maksimal ${maks} blok. <b>Belok</b> hanya memutar arah Bit 90° di tempat, tidak memindahkannya. Di komputer, tombol panah juga bisa dipakai.</p>
    <div class="robot-wrap">
      <div class="rgrid" style="--w:${W};--h:${H}" role="img" aria-label="Peta ${W} kolom × ${H} baris. Bit di kolom ${sx + 1} baris ${sy + 1} menghadap ${ARAH[t.arah]}. Server di kolom ${gx + 1} baris ${gy + 1}. Gedung: ${g.map((r, y) => [...r].map((c, x) => c === "#" ? `(${x + 1},${y + 1})` : "").filter(Boolean).join(" ")).filter(Boolean).join(" ")}.">
        ${g.map(r => [...r].map(c => `<div class="rcell ${c === "#" ? "wall" : c === "G" ? "goal" : c === "S" ? "start" : ""}">${c === "#" ? svgGedung() : c === "G" ? svgServer() : ""}</div>`).join("")).join("")}
        <div class="rbot" id="rbot"><div class="rb-in">${svgBot()}</div></div>
      </div>
      <div class="rctrl">
        <div class="palette" role="group" aria-label="Perintah">${["M","L","R"].map(c => `<button class="cmd" data-c="${c}">${ic(IKON[c])}<span>${NAMA[c]}</span></button>`).join("")}</div>
        <div class="prog-head"><span class="eyebrow">Program <span id="pcount">0/${maks}</span></span><span class="row"><button class="btn btn-sm" data-c="undo">${ic("undo")} Hapus</button><button class="btn btn-sm btn-ghost" data-c="clear">Kosongkan</button></span></div>
        <ol class="prog" id="prog" aria-label="Program"></ol>
        <div class="row"><button class="btn btn-gold" data-c="run">${ic("play")} Jalankan</button><button class="btn" data-c="give" id="btn-give" hidden>Lihat solusi (nilai 0)</button></div>
        <p class="rmsg" id="rmsg" aria-live="polite"></p>
      </div>
    </div>`;
  const rbot = $("#rbot", el), rin = $(".rb-in", el), progEl = $("#prog", el), msg = $("#rmsg", el);
  function taruh(x, y, instan) {
    if (instan) { rbot.style.transition = "none"; rin.style.transition = "none"; }
    rbot.style.transform = `translate(${x * 100}%, ${y * 100}%)`; rin.style.transform = `rotate(${rot}deg)`; rin.style.setProperty("--rot", `rotate(${rot}deg)`);
    if (instan) { void rbot.offsetWidth; rbot.style.transition = ""; rin.style.transition = ""; }
  }
  const reset = () => { rot = SUDUT[t.arah]; taruh(sx, sy, true); rbot.classList.remove("bump", "win"); };
  function gambar(aktif = -1) {
    progEl.innerHTML = prog.length ? prog.map((c, k) => `<li><button class="blk ${k === aktif ? "run" : ""}" data-k="${k}" aria-label="Langkah ${k + 1}: ${NAMA[c]}. Ketuk untuk menghapus">${ic(IKON[c])}<span>${k + 1}</span></button></li>`).join("")
      : '<li class="muted small empty">Belum ada perintah. Ketuk tombol perintah di atas.</li>';
    $("#pcount", el).textContent = `${prog.length}/${maks}`;
  }
  function tambah(c) {
    if (jalan || selesai) return;
    if (prog.length >= maks) { msg.textContent = `Maksimal ${maks} blok. Hapus beberapa perintah dulu.`; bunyi("salah"); return; }
    prog.push(c); bunyi("klik"); reset(); msg.textContent = ""; gambar();
  }
  const hapus = () => { if (jalan || selesai) return; prog.pop(); reset(); gambar(); };
  async function jalankan() {
    if (jalan || selesai) return; if (!prog.length) { msg.textContent = "Tambahkan perintah dulu."; return; }
    jalan = true; el.classList.add("sibuk"); reset(); msg.textContent = "Bit berjalan…"; await tidur(RM ? 40 : 160); if (mati) return;
    let x = sx, y = sy, d = t.arah; const jeda = RM ? 110 : 380;
    for (let k = 0; k < prog.length; k++) {
      gambar(k); const c = prog[k];
      if (c === "M") {
        const nx = x + D[d][0], ny = y + D[d][1], luar = nx < 0 || ny < 0 || nx >= W || ny >= H;
        if (luar || g[ny][nx] === "#") { rbot.classList.add("bump"); bunyi("tabrak"); await tidur(jeda); if (mati) return; return gagalJalan(`Langkah ${k + 1}: Bit ${luar ? "keluar dari peta" : "menabrak gedung"}.`); }
        x = nx; y = ny;
      } else { d = A[(A.indexOf(d) + (c === "L" ? 3 : 1)) % 4]; rot += c === "L" ? -90 : 90; }
      taruh(x, y); bunyi("langkah"); await tidur(jeda); if (mati) return;
      if (x === gx && y === gy) return berhasil();
    }
    return gagalJalan(`Program selesai, tetapi paket belum sampai. Bit berhenti di kolom ${x + 1}, baris ${y + 1}.`);
  }
  function gagalJalan(p) {
    jalan = false; el.classList.remove("sibuk"); gagal++; msg.textContent = `${p} Perbaiki programmu, lalu jalankan lagi.`;
    if (gagal >= 3) $("#btn-give", el).hidden = false; gambar();
  }
  function berhasil() {
    jalan = false; selesai = true; el.classList.remove("sibuk"); rbot.classList.add("win"); gambar(); bunyi("benar");
    $$("button", el).forEach(b => { b.disabled = true; }); msg.textContent = menyerah ? "Begitulah salah satu solusinya." : "Paket terkirim!";
    const nilai = menyerah ? 0 : Math.max(.4, 1 - .2 * gagal), solTx = sol.map(c => NAMA[c]).join(" → ");
    ctx.selesai({nilai, judul:menyerah ? "Ini salah satu solusinya" : gagal ? "Paket terkirim!" : "Paket terkirim pada percobaan pertama!", jawab:menyerah ? "Melihat solusi" : `Program ${prog.length} blok, ${gagal} kali percobaan gagal`, kunci:"",
      bahas:`<p>${menyerah ? "Kamu melihat solusinya, jadi tugas ini bernilai 0." : `Paket terkirim${prog.length <= sol.length ? " dengan program sependek mungkin" : ""}! ${gagal ? `Ada ${gagal} percobaan gagal; setiap kegagalan mengurangi nilai 20 (minimal 40).` : "Berhasil pada percobaan pertama."}`}</p><p><b>Program terpendek (${sol.length} blok):</b> ${solTx}.</p>`});
  }
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-c],[data-k]"); if (!b || b.disabled) return;
    if (b.dataset.k !== undefined) { if (jalan || selesai) return; prog.splice(+b.dataset.k, 1); bunyi("klik"); reset(); gambar(); return; }
    const c = b.dataset.c;
    if (c === "M" || c === "L" || c === "R") tambah(c);
    else if (c === "undo") hapus();
    else if (c === "clear") { if (!jalan && !selesai) { prog = []; reset(); gambar(); } }
    else if (c === "run") jalankan();
    else if (c === "give") { if (jalan || selesai) return; menyerah = true; prog = sol.slice(); gambar(); jalankan(); }
  });
  reset(); gambar();
  return {
    auto:true,
    hint:() => `Awali programmu dengan: ${sol.slice(0, 3).map(c => NAMA[c]).join(", ")}.`,
    key(e) { if (e.target.closest("input,textarea")) return; const m = {ArrowUp:"M", ArrowLeft:"L", ArrowRight:"R"}[e.key]; if (m) { e.preventDefault(); tambah(m); } else if (e.key === "Backspace") { e.preventDefault(); hapus(); } },
    destroy() { mati = true; }
  };
};

function catat(h) {

  const pakai = !!m.hint[m.i], nilai = Math.max(0, Math.min(1, h.nilai)) * (pakai ? .8 : 1);

  m.detail[m.i] = {judul:t.judul || ringkas(t.q), nilai, jawab:h.jawab || "", kunci:h.kunci || "", bahas:h.bahas || (t.b ? `<p>${t.b}</p>` : ""), hint:pakai};

  bunyi(nilai >= .999 ? "benar" : nilai >= .5 ? "sebagian" : "salah");
  const kls = nilai >= .999 ? "ok" : nilai >= .5 ? "part" : "bad";
  const judul = h.judul || (nilai >= .999 ? pick(["Tepat sekali!", "Mantap, chip makin terang!", "Sempurna!"]) : nilai >= .5 ? "Sebagian sudah benar" : "Belum tepat");
  const fb = $("#fb"); fb.className = "fb " + kls;
  fb.innerHTML = `<div class="fb-head">${bit(kls === "ok" ? "senang" : kls === "bad" ? "sedih" : "biasa", 48)}<div><p class="fb-title">${judul}</p><p class="muted small">Nilai tugas ${Math.round(nilai * 100)}${pakai ? " · petunjuk dipakai (maks. 80)" : ""}</p></div></div>

}
function lanjut() { if (!MAIN) return; MAIN.i++; if (MAIN.i >= MAIN.tugas.length) selesaiMisi(); else tampilTugas(); }
function selesaiMisi() {
  const m = MAIN; m.selesai = true; hentikanTugas();
  const skor = Math.round(m.nilai.reduce((a, b) => a + b, 0) / m.tugas.length * 100), baru = [];
  const beri = id => { if (!S.lencana[id]) { S.lencana[id] = tglLokal(); baru.push(id); } };
  let lama = 0, xp = 0;
  if (m.ujian) {
    const u = S.ujian || {best:0, lulus:false, tanggal:null, main:0}; lama = u.best; u.main++;
    if (skor > u.best) { u.best = skor; u.tanggal = tglLokal(); } u.lulus = u.best >= KONFIG.kktp; S.ujian = u; xp = Math.max(0, skor - lama) * 20;
    if (u.lulus) beri("prosesor");
  } else {
    const r = S.level[m.id] || {best:0, main:0}; lama = r.best; r.main++; if (skor > r.best) r.best = skor; S.level[m.id] = r; xp = Math.max(0, skor - lama) * 10;
    if (skor >= KONFIG.kktp) beri("tuntas-" + m.id);
    if (skor === 100) beri("sempurna");
    if (skor >= KONFIG.kktp && !m.hint.some(Boolean)) beri("mandiri");
    if (r.main >= 3) beri("gigih");
    if (LEVEL.every(L => skorLevel(L.id) >= 90)) beri("bintang");
  }
  simpan();
  HASIL = {id:m.id, ujian:m.ujian, skor, lama, xp, baru, detail:m.detail};
  bunyi(skor >= KONFIG.kktp ? "naik" : "sebagian");

}

function teksLaporan() {
  const pf = S.profil || {nama:"-", kelas:"-"}, tgl = tglLokal(), skor = LEVEL.map(L => skorLevel(L.id)), u = S.ujian ? S.ujian.best : 0;
  const kode = kodeVerifikasi(pf.nama, pf.kelas, skor, u, tgl);
  return ["LAPORAN HASIL BELAJAR · NYALAKAN SIRKUIT!", `${KONFIG.mapel} · Fase ${KONFIG.fase} · Kelas X SMK`, "",
    `Nama    : ${pf.nama}`, `Kelas   : ${pf.kelas}`, `Tanggal : ${tgl}`, "",
    ...LEVEL.map((L, i) => `${L.kode} ${L.nama} (${L.el}) : ${skor[i]} · ${"★".repeat(bintangDari(skor[i]))}${"☆".repeat(3 - bintangDari(skor[i]))} · ${skor[i] >= KONFIG.kktp ? "Tuntas" : pernah(L.id) ? "Belum tuntas" : "Belum dicoba"}`),
    `Ujian Akhir : ${u} · ${u >= KONFIG.kktp ? "Lulus" : S.ujian ? "Belum lulus" : "Belum dicoba"}`, "",
    `Total XP : ${xpTotal().toLocaleString("id-ID")}`, `Lencana  : ${LENCANA.filter(l => S.lencana[l.id]).length}/${LENCANA.length}`, `Kode verifikasi : ${kode}`].join("\n");
}
function kodeVerifikasi(nama, kelas, skor, u, tgl) {
  const s = [String(nama).trim().toUpperCase(), String(kelas).trim().toUpperCase(), skor.join(","), u, tgl, KONFIG.garam].join("|");
  let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  const x = h.toString(16).toUpperCase().padStart(8, "0"); return x.slice(0, 4) + "-" + x.slice(4);
}
function periksaLaporan(teks) {
  const ambil = re => { const m = teks.match(re); return m ? m[1].trim() : null; };
  const nama = ambil(/Nama\s*:\s*(.+)/), kelas = ambil(/Kelas\s*:\s*(.+)/), tgl = ambil(/Tanggal\s*:\s*(\S+)/), kode = ambil(/Kode verifikasi\s*:\s*(\S+)/), u = ambil(/Ujian Akhir\s*:\s*(\d{1,3})/);
  const skor = LEVEL.map(L => { const m = teks.match(new RegExp("^\\s*" + L.kode + "\\b.*?:\\s*(\\d{1,3})", "m")); return m ? +m[1] : null; });
  if (!nama || !kelas || !tgl || !kode || u === null || skor.some(x => x === null)) return {ok:false, pesan:"Format laporan tidak lengkap. Pastikan seluruh teks laporan ikut disalin."};
  const cocok = kodeVerifikasi(nama, kelas, skor, +u, tgl) === kode.toUpperCase();
  const rata = Math.round(skor.reduce((a, b) => a + b, 0) / skor.length);
  return cocok ? {ok:true, pesan:`Valid. ${esc(nama)} (${esc(kelas)}), ${tgl}: rata-rata misi ${rata}, Ujian Akhir ${u}, ${skor.filter(x => x >= KONFIG.kktp).length} dari ${LEVEL.length} misi tuntas.`}
    : {ok:false, pesan:"Kode verifikasi tidak cocok. Laporan mungkin diubah, salah salin, atau dibuat dengan pengaturan gim yang berbeda."};
}

let MODAL = null, toastT = 0;
function bukaModal({judul, isi, tombol = []}) {
  tutupModal(true);
  const root = $("#modal-root"), prev = document.activeElement;
  root.innerHTML = `<div class="backdrop" data-tutup="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-judul" tabindex="-1"><h2 id="m-judul">${judul}</h2><div class="stack">${isi}</div><div class="row end">${tombol.map((t, i) => `<button class="btn ${t.kelas || ""}" data-m="${i}">${t.label}</button>`).join("")}</div></div></div>`;
  MODAL = {prev};
  $(".backdrop", root).addEventListener("click", e => {
    if (e.target.dataset.tutup) { tutupModal(); return; }
    const b = e.target.closest("[data-m]"); if (b) { const t = tombol[+b.dataset.m]; if (t.aksi && t.aksi() === false) return; tutupModal(); }
  });
  ($("[data-m]", root) || $(".modal", root)).focus();
}
function tutupModal(diam) { if (!MODAL) return; const p = MODAL.prev; MODAL = null; $("#modal-root").innerHTML = ""; if (!diam) try { if (p && document.contains(p)) p.focus(); } catch (e) {} }
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
function tanyaKeluar(lanjutkan) {

  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const pf = S.profil || {nama:"", kelas:""}, u = S.ujian || {best:0, tanggal:tglLokal()};
  g.fillStyle = v("--mask"); g.fillRect(0, 0, W, H);
  g.fillStyle = "rgba(238,245,236,.06)"; for (let x = 20; x < W; x += 28) for (let y = 20; y < H; y += 28) g.fillRect(x, y, 2, 2);
  g.strokeStyle = v("--copper"); g.lineWidth = 8; g.strokeRect(40, 40, W - 80, H - 80);
  g.strokeStyle = v("--copper-lit"); g.lineWidth = 2; g.strokeRect(62, 62, W - 124, H - 124);
  g.lineCap = "round"; g.lineJoin = "round";
  const jalur = (pts, lit) => { g.strokeStyle = lit ? v("--copper-lit") : v("--copper"); g.globalAlpha = lit ? 1 : .5; g.lineWidth = 7; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); g.globalAlpha = 1;
    const [ex, ey] = pts[pts.length - 1]; g.fillStyle = v("--mask-deep"); g.beginPath(); g.arc(ex, ey, 9, 0, 7); g.fill(); g.strokeStyle = v("--copper-lit"); g.lineWidth = 3; g.stroke(); };
  [[[62, 210], [150, 210], [210, 150], [210, 62]], [[62, 300], [250, 300], [320, 230]], [[W - 62, 210], [W - 150, 210], [W - 210, 150], [W - 210, 62]], [[W - 62, 300], [W - 250, 300], [W - 320, 230]],
   [[62, H - 210], [150, H - 210], [210, H - 150], [210, H - 62]], [[W - 62, H - 210], [W - 150, H - 210], [W - 210, H - 150], [W - 210, H - 62]]].forEach((p, i) => jalur(p, i % 2 === 0));
  g.textAlign = "center";
  g.fillStyle = v("--copper-lit"); g.font = '700 26px "JetBrains Mono", monospace'; g.fillText("SERTIFIKAT PENYELESAIAN", W / 2, 200);
  g.fillStyle = v("--silk"); g.font = '700 92px "Chakra Petch", sans-serif'; g.fillText("NYALAKAN SIRKUIT!", W / 2, 300);
  g.fillStyle = v("--silk-dim"); g.font = '400 32px "Atkinson Hyperlegible", sans-serif'; g.fillText("Diberikan kepada", W / 2, 392);
  let fs = 76; g.font = `700 ${fs}px "Atkinson Hyperlegible", sans-serif`; while (g.measureText(pf.nama).width > 1150 && fs > 36) { fs -= 4; g.font = `700 ${fs}px "Atkinson Hyperlegible", sans-serif`; }
  g.fillStyle = v("--silk"); g.fillText(pf.nama, W / 2, 485);
  g.strokeStyle = v("--copper-lit"); g.lineWidth = 3; g.beginPath(); g.moveTo(W / 2 - 420, 515); g.lineTo(W / 2 + 420, 515); g.stroke();
  g.fillStyle = v("--silk-dim"); g.font = '400 32px "Atkinson Hyperlegible", sans-serif'; g.fillText(`Kelas ${pf.kelas}`, W / 2, 568);
  g.fillStyle = v("--silk"); g.font = '400 32px "Atkinson Hyperlegible", sans-serif';
  g.fillText("telah menyalakan seluruh chip Kota Digital dan lulus Ujian Akhir", W / 2, 640); g.fillText(`${KONFIG.mapel} Fase ${KONFIG.fase} · Kelas X SMK`, W / 2, 686);
  const bx = W / 2 - 170, by = 730; g.fillStyle = v("--ic"); g.fillRect(bx, by, 340, 130); g.strokeStyle = v("--copper-lit"); g.lineWidth = 3; g.strokeRect(bx, by, 340, 130);
  g.fillStyle = v("--pin"); for (let k = 0; k < 9; k++) { g.fillRect(bx + 22 + k * 36, by - 14, 14, 12); g.fillRect(bx + 22 + k * 36, by + 132, 14, 12); }
  g.fillStyle = v("--silk-dim"); g.font = '700 22px "JetBrains Mono", monospace'; g.fillText("NILAI UJIAN", W / 2, by + 40);
  g.fillStyle = v("--copper-lit"); g.font = '700 70px "Chakra Petch", sans-serif'; g.fillText(String(u.best), W / 2, by + 108);
  g.font = '400 26px "Atkinson Hyperlegible", sans-serif'; g.fillStyle = v("--silk-dim");
  g.textAlign = "left"; g.fillText(`Tanggal: ${u.tanggal || tglLokal()}`, 260, H - 150);

const AKSI = {
  "lewati-boot"() { selesaiBoot(); },
  mulai() { if (rute.v !== "splash") return; bunyi("klik"); go(S.profil ? "peta" : "profil"); },
  "simpan-profil"() {
    const nama = $("#in-nama").value.trim().replace(/\s+/g, " "), kelas = $("#in-kelas").value.trim().replace(/\s+/g, " "), err = $("#err-profil");
    if (nama.length < 3) { err.textContent = "Tulis nama lengkapmu (minimal 3 huruf)."; $("#in-nama").focus(); return; }
    if (!kelas) { err.textContent = "Tulis kelasmu, misalnya X TKJ 2."; $("#in-kelas").focus(); return; }
    S.profil = {nama, kelas}; simpan(); bunyi("benar"); go("peta");
  },
  buka(b) {
    const id = b.dataset.id; bunyi("klik");
    if (id === "ujian") { if (!ujianTerbuka()) { toast(`Prosesor terkunci. Nyalakan semua chip dulu (skor ≥ ${KONFIG.syaratBuka}).`); return; } go("briefing", "ujian"); return; }
    const i = LEVEL.findIndex(L => L.id === id);
    if (!terbuka(i)) { toast(`Chip ini masih padam. Raih skor ≥ ${KONFIG.syaratBuka} di ${LEVEL[i - 1].kode} dulu.`); return; }
    go("briefing", id);
  },
  "mulai-misi"(b) {
    const id = b.dataset.id, uj = id === "ujian";
    MAIN = {id, ujian:uj, tugas:uj ? acak(susunTugas(UJIAN.rencana)) : susunTugas(LEVEL.find(L => L.id === id).rencana), i:0, nilai:[], hint:[], detail:[], streak:0, selesai:false};
    bunyi("klik"); go("main", id, {paksa:true});
  },
  periksa() { if (!CTL || !CTL.periksa || !MAIN || MAIN.dicek) return; MAIN.dicek = true; catat(CTL.periksa(!MAIN.ujian)); },
  lanjut() { bunyi("klik"); lanjut(); },
  petunjuk() {
    const m = MAIN; if (!m || m.dicek) return; const t = m.tugas[m.i], tx = CTL && CTL.hint ? CTL.hint() : t.h; if (!tx) return;
    m.hint[m.i] = true; const hb = $("#hintbox");
    hb.innerHTML = `<div class="say">${bit("biasa", 44)}<p class="bubble"><b>Petunjuk:</b> ${tx}<br><span class="small">Nilai maksimal tugas ini menjadi 80.</span></p></div>`; hb.hidden = false; $("#btn-hint").disabled = true; bunyi("klik");
  },
  keluar() { go("briefing", MAIN ? MAIN.id : null); },
  suara() { S.suara = !S.suara; simpan(); renderHud(); if (S.suara) bunyi("klik"); },
  layar() {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => toast("Layar penuh tidak tersedia di sini.")); }
    catch (e) { toast("Layar penuh tidak tersedia di sini."); }
  },
  salin() {
    const tx = teksLaporan(), pilihTeks = () => { const el = $("#laporan"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Teks laporan sudah dipilih. Tekan Salin atau Ctrl+C."); };
    try { navigator.clipboard.writeText(tx).then(() => toast("Laporan disalin. Tempel di chat guru."), pilihTeks); } catch (e) { pilihTeks(); }
  },
  cetak() { try { window.print(); } catch (e) {} },
  async sertifikat() {
    if (!(S.ujian && S.ujian.lulus)) { toast("Sertifikat tersedia setelah lulus Ujian Akhir."); return; }
    bukaModal({judul:"Sertifikat", isi:'<p class="muted">Menyiapkan sertifikat…</p>', tombol:[{label:"Tutup"}]});
    const url = await gambarSertifikat(), nama = "sertifikat-" + (S.profil.nama || "siswa").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".png";
    if (!MODAL) return;
    bukaModal({judul:"Sertifikat", isi:`<img src="${url}" alt="Sertifikat penyelesaian atas nama ${esc(S.profil.nama)}, nilai Ujian Akhir ${S.ujian.best}">
      ${DI_FRAME ? '<p class="muted small">Untuk menyimpan: tekan lama gambar (HP) atau klik kanan lalu pilih Simpan gambar (komputer).</p>' : `<p><a class="btn btn-gold" href="${url}" download="${nama}">${ic("award")} Unduh PNG</a></p><p class="muted small">Bisa juga tekan lama atau klik kanan gambar lalu simpan.</p>`}`, tombol:[{label:"Tutup"}]});
  },
  "ganti-profil"() {
    bukaModal({judul:"Ubah nama dan kelas", isi:`<div class="field"><label for="m-nama">Nama lengkap</label><input id="m-nama" type="text" maxlength="40" value="${esc(S.profil.nama)}"></div><div class="field"><label for="m-kelas">Kelas</label><input id="m-kelas" type="text" maxlength="20" value="${esc(S.profil.kelas)}"></div>`,
      tombol:[{label:"Batal"}, {label:"Simpan", kelas:"btn-gold", aksi:() => {
        const n = $("#m-nama").value.trim().replace(/\s+/g, " "), k = $("#m-kelas").value.trim().replace(/\s+/g, " ");
        if (n.length < 3 || !k) { toast("Nama minimal 3 huruf dan kelas wajib diisi."); return false; }
        S.profil = {nama:n, kelas:k}; simpan(); render(); toast("Profil diperbarui.");
      }}]});
    $("#m-nama").focus();
  },
  "guru-masuk"() { const p = $("#in-pin"); if (p.value === KONFIG.pinGuru) { GURU_OK = true; bunyi("benar"); render(); } else { $("#err-pin").textContent = "PIN salah."; bunyi("salah"); p.select(); } },
  "guru-keluar"() { GURU_OK = false; render(); },
  "demo-on"() { S_ASLI = JSON.parse(JSON.stringify(S)); DEMO = true; if (!S.profil) S.profil = {nama:"Mode Demo", kelas:"Guru"}; toast("Mode Demo aktif: semua chip terbuka."); render(); },
  "demo-off"() { if (!DEMO) return; DEMO = false; S = S_ASLI || muat(); S_ASLI = null; toast("Mode Demo dimatikan. Progres kembali seperti semula."); if (BUTUH_PROFIL.includes(rute.v) && !S.profil) go("profil"); else go(rute.v === "main" || rute.v === "hasil" ? "peta" : rute.v, rute.p, {paksa:true}); },
  "cek-laporan"() { const r = periksaLaporan($("#in-lap").value || ""); const el = $("#hasil-lap"); el.className = r.ok ? "okmsg" : "err"; el.innerHTML = r.pesan; },
  reset() {
    bukaModal({judul:"Hapus progres perangkat ini?", isi:"<p>Nama, skor, lencana, dan hasil ujian di browser ini akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.</p>",
      tombol:[{label:"Batal", kelas:"btn-gold"}, {label:"Hapus progres", aksi:() => { try { localStorage.removeItem(KUNCI); } catch (e) {} DEMO = false; S_ASLI = null; S = stateAwal(); toast("Progres dihapus."); go("guru", null, {paksa:true}); }}]});
  }
};

/* ---------- Event global ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("#modal-root") && !e.target.closest("[data-act],[data-go]")) return;
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); bunyi("klik"); go(g.dataset.go, g.dataset.p || null); return; }
  const a = e.target.closest("[data-act]"); if (a && AKSI[a.dataset.act]) { if (a.disabled) return; AKSI[a.dataset.act](a, e); }
});
document.addEventListener("keydown", e => {
  if (MODAL) {
    if (e.key === "Escape") { e.preventDefault(); tutupModal(); return; }
    if (e.key === "Tab") { const f = $$("#modal-root button, #modal-root a[href], #modal-root input, #modal-root textarea").filter(x => !x.disabled); if (!f.length) return;
      const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    return;
  }
  if (rute.v === "boot") { if (e.key === "Enter" || e.key === " " || e.key === "Escape") { e.preventDefault(); AKSI["lewati-boot"](); } return; }
  if (rute.v === "splash" && !e.repeat && (e.key === "Enter" || e.key === " " || e.key === "Escape")) { e.preventDefault(); AKSI.mulai(); return; }
  if (CTL && CTL.key && rute.v === "main" && !(MAIN && MAIN.dicek)) CTL.key(e);
});

/* ---------- Mulai ---------- */
function start() {
  rute = {v:"boot", p:null};
  const h = (location.hash || "").replace("#", ""), boleh = ["peta","tujuan","rapor","guru","tentang"];
  if (boleh.includes(h)) { rute = {v:h, p:null}; if (BUTUH_PROFIL.includes(h) && !S.profil) rute = {v:"profil", p:null}; }
  pasangRiwayat(rute, true); render();
}
start();
</script>
